name: Mobile tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Shared and Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run shared and Android unit tests
        # commonTest runs on the Android JVM target together with androidUnitTest.
        # Bound memory and workers for the hosted runner instead of the local defaults.
        run: >-
          ./gradlew :composeApp:testTstDebugUnitTest
          -PtargetEnvironment=tst
          '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
          -Pkotlin.daemon.jvmargs=-Xmx2g
          --max-workers=2 --no-daemon --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-reports
          path: |
            composeApp/build/reports/tests/testTstDebugUnitTest/
            composeApp/build/test-results/testTstDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
